header:
  version: 14

  includes:
    - repo: meta-qcom-arduino
      file: ci/uno-q.yml
    - repo: meta-qcom-arduino
      file: ci/qcom-distro.yml
    - ci/include/base.yml

distro: qcom-distro-sota
target: core-image-full-cmdline

repos:
  meta-qcom-arduino:
    url: https://github.com/qualcomm-linux/meta-qcom-arduino
    branch: main

local_conf_header:
  dev-adbd: |
    # adb reaches the console on boards with no bughopper attached.
    IMAGE_CLASSES += "image-adbd"
    EXTRA_IMAGE_FEATURES += "enable-adbd"

  rootfs-growth: |
    IMAGE_INSTALL:append = " resize-rootfs"
