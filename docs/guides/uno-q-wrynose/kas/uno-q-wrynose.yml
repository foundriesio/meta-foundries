header:
  version: 14
  includes:
    - repo: meta-foundries
      file: ci/include/base.yml

machine: uno-q
distro: qcom-distro-sota
target: core-image-full-cmdline

# Every revision below is the set the October 8, 2026 hardware validation built:
# meta-foundries ff40dc1 with meta-qcom-arduino's ci/uno-q.yml and meta-qcom's
# ci/base.lock.yml, flattened. The patches are meta-qcom's, at the pinned revision.
repos:
  meta-foundries:
    url: https://github.com/foundriesio/meta-foundries.git
    commit: ff40dc16da368d471e890dd19fe945a220ef3ce2
    path: meta-foundries
  bitbake:
    url: https://github.com/openembedded/bitbake
    branch: master
    commit: 18cca50ba3da5ce27bc674478957bb08e7536b9a
    layers:
      .: disabled
  oe-core:
    url: https://github.com/openembedded/openembedded-core
    branch: master
    commit: db81c1a42a0f552d9a8ec124f004ae2063d58c33
    patches:
      fix-igt-pause:
        repo: meta-qcom
        path: patches/oe-core/0001-igt-gpu-tools-fix-build-on-non-x86-platforms.patch
      uboot-sign-spl-bss-padding:
        repo: meta-qcom
        path: patches/oe-core/0003-uboot-sign-keep-the-SPL-BSS-padding-when-reassembling.patch
      revert-python3-pycairo:
        repo: meta-qcom
        path: patches/oe-core/0001-Revert-python3-pycairo-inherit-python3-dir-not-pytho.patch
    layers:
      meta:
  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: master
    commit: 8b1d948deee701859ece9f007cb09965f5e00680
    layers:
      meta-filesystems:
      meta-gnome:
      meta-multimedia:
      meta-networking:
      meta-oe:
      meta-python:
      meta-xfce:
  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom
    branch: master
    commit: 21c9c0d8138e3472b0ac04e780f18be14aa959ab
  meta-qcom-distro:
    url: https://github.com/qualcomm-linux/meta-qcom-distro
    branch: main
    commit: acc7f52e830e4308ea97020184cfb8171b0b1d87
  meta-qcom-arduino:
    url: https://github.com/qualcomm-linux/meta-qcom-arduino
    branch: main
    commit: a65e94a51f8233607b683787735225a10d80fe65
  meta-ai:
    url: https://github.com/qualcomm-linux/meta-ai
    branch: main
    commit: 3511d6c9669683fc232211eb72e1549d6db6e660
  meta-audioreach:
    url: https://github.com/AudioReach/meta-audioreach
    branch: master
    commit: c25274a1bf08e0a508f575f4ae0bcabb405329e7
  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: master
    commit: f45cc3787c11d040dbef8e7f956a4da420375829
  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    branch: master
    commit: 7351443c6579671bcf048817438f1740ad23eaab
    patches:
      libsepol-nativesdk:
        repo: meta-qcom
        path: patches/selinux/0001-libsepol-enable-nativesdk.patch
      libselinux-nativesdk:
        repo: meta-qcom
        path: patches/selinux/0002-libselinux-enable-nativesdk.patch
      libselinux-python-swig-4.5:
        repo: meta-qcom
        path: patches/selinux/0003-libselinux-python-fix-the-build-against-swig-4.5.0.patch
  meta-updater:
    url: https://github.com/uptane/meta-updater
    branch: master
    commit: 3f79539a8e1250c46d824b3af2415b9add945161
  meta-security:
    url: https://git.yoctoproject.org/meta-security
    branch: master
    commit: 0339b65f63877ed36fcffa44953e57c3bb969ca9
    layers:
      .:
      meta-tpm:

local_conf_header:
  guide-identity: |
    LMP_FACTORY_TAG = "wrynose"
    FIO_DEVICE_API = "http://unoq-update.test:8080/v1/devices"
    FIO_OAUTH_API = "http://unoq-update.test:8080/oauth2"
  guide-adb: |
    IMAGE_CLASSES += "image-adbd"
    EXTRA_IMAGE_FEATURES += "enable-adbd"
    # The UNO Q machine installs a short module list; the ADB USB gadget needs these.
    IMAGE_INSTALL:append = " kernel-module-libcomposite kernel-module-usb-f-fs"
  rootfs-growth: |
    IMAGE_INSTALL:append = " resize-rootfs"
  # From meta-qcom ci/base.yml at the pinned revision.
  clo-mirrors: |
    MIRRORS:append = " \
    git://github.com git://git.codelinaro.org/clo/yocto-mirrors/github/ \
    git://.*/ git://git.codelinaro.org/clo/yocto-mirrors/ \
    https://.*/.*/ https://artifacts.codelinaro.org/codelinaro-le/ \
    "
  systemd-watchdog: |
    WATCHDOG_RUNTIME_SEC:pn-systemd = "30"
