# This file holds documentation for the variables meta-foundries recipes read.
# Update it whenever a recipe in this layer starts reading a new user-facing
# variable.

FIO_DEVICE_API[doc] = "Build-time default for the OTA device-registration API endpoint compiled into fio-device-register. On the device, the DEVICE_API environment variable overrides it."
FIO_OAUTH_API[doc] = "Build-time default for the OAuth endpoint compiled into fio-device-register. On the device, the OAUTH_BASE environment variable overrides it."
