# This file holds documentation for the variables meta-foundries recipes read.
# Update it whenever a recipe in this layer starts reading a new user-facing
# variable.

LMP_FACTORY[doc] = "Factory name fio-device-register reads from /etc/os-release at registration time. The key name is fixed by the upstream binary, so it is spelled the same in the build configuration. Set it in the distro configuration along with OS_RELEASE_FIELDS += \"LMP_FACTORY\"; this layer leaves os-release alone to keep its signature stable, and ci/ sets a value for its own builds only. On the device, the DEVICE_FACTORY environment variable and the --factory option both take precedence over the os-release value."
LMP_FACTORY_TAG[doc] = "Tag fio-device-register reads from /etc/os-release at registration time, restricting the device to Targets carrying it. The key name is fixed by the upstream binary, so it is spelled the same in the build configuration. Set it in the distro configuration along with OS_RELEASE_FIELDS += \"LMP_FACTORY_TAG\"; this layer leaves os-release alone to keep its signature stable, and ci/ sets a value for its own builds only. There is no environment variable fallback on the device, only the --tags option."
FIO_DEVICE_API[doc] = "Build-time default for the OTA device-registration API endpoint compiled into fio-device-register. On the device, the DEVICE_API environment variable overrides it."
FIO_OAUTH_API[doc] = "Build-time default for the OAuth endpoint compiled into fio-device-register. On the device, the OAUTH_BASE environment variable overrides it."
SOTA_CLIENT[doc] = "Name of the OTA client package. fio-device-register RDEPENDS on it and passes it to the upstream build as -DSOTA_CLIENT, which names the systemd service the tool starts after registration. Defaults to aktualizr-lite, the client this layer provides. Set it in the distro configuration to ship a different client, or empty to leave the upstream \"aktualizr-lite\" default compiled in without the RDEPENDS that installs the client."
COMPOSE_HTTP_TIMEOUT[doc] = "Timeout in seconds the Docker Compose client uses, written into aktualizr-lite.service as the COMPOSE_HTTP_TIMEOUT environment variable. Defaults to 60."
DOCKER_CRED_HELPER_CFG[doc] = "Path to the Docker credential configuration aktualizr-lite reads when pulling Apps, written into aktualizr-lite.service as the REGISTRY_AUTH_FILE environment variable. Defaults to a config.json under the library directory."
PKCS11_ENGINE_PATH[doc] = "Path to the PKCS#11 engine aktualizr-lite loads, compiled in as -DPKCS11_ENGINE_PATH when the hsm PACKAGECONFIG is enabled. Defaults to the OpenSSL 3 engines directory under the library path. Distros pairing this layer with another OpenSSL build point it at the engine that build installs."
COMPOSE_APP_STORE_ROOT[doc] = "Directory composectl compiles in as its blob store for fetched Apps, where aktualizr-lite expects the reset-apps content. Defaults to /var/sota/reset-apps, under the storage directory the aktualizr-lite tmpfiles entry creates. A distro moving the sota storage sets this to match."
COMPOSE_APP_COMPOSE_ROOT[doc] = "Directory composectl compiles in as the location it writes App compose projects to, where aktualizr-lite expects to find them. Defaults to /var/sota/compose-apps, under the storage directory the aktualizr-lite tmpfiles entry creates. A distro moving the sota storage sets this to match."
COMPOSE_APP_BASE_SYSTEM_CONFIG[doc] = "Directory composectl compiles in as the base system configuration it reads the container registry credentials from. Defaults to a docker directory under the library path, the directory holding the config.json that DOCKER_CRED_HELPER_CFG points aktualizr-lite at. Keep the two in agreement."
COMPOSE_APP_MANAGER[doc] = "Packages providing the compose-app manager. packagegroup-fio-ota RDEPENDS on them, and fio-device-register enables its composeapp PACKAGECONFIG when the list names composectl, so a single setting decides whether an image handles Apps. Defaults to composectl and its aklite-apps symlink, the manager this layer provides. Set it empty in the distro configuration to build a device that takes ostree updates without Apps."
